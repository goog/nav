<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>machbook.club sitemap</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Lato:wght@300;400&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #faf8f5;
      --surface: #ffffff;
      --surface2: #f5f2ed;
      --border: rgba(180,160,130,0.18);
      --border-hover: rgba(180,160,130,0.38);
      --text: #2c2520;
      --muted: #7a6f65;
      --dim: #b0a498;
      --rose: #c9897a;
      --sage: #8aab96;
      --gold: #c4a35a;
      --lavender: #9b8db5;
    }

    body {
      font-family: 'Lato', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      font-weight: 300;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background:
        radial-gradient(ellipse 70% 50% at 15% 0%, rgba(201,137,122,0.07) 0%, transparent 55%),
        radial-gradient(ellipse 60% 45% at 85% 100%, rgba(138,171,150,0.08) 0%, transparent 55%);
      pointer-events: none;
      z-index: 0;
    }

    .wrap {
      position: relative;
      z-index: 1;
      max-width: 1080px;
      margin: 0 auto;
      padding: 0 32px;
    }

    nav {
      padding: 28px 0 24px;
      border-bottom: 1px solid var(--border);
    }

    .nav-inner {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      max-width: 1080px;
      margin: 0 auto;
      padding: 0 32px;
    }

    .logo {
      font-family: 'Playfair Display', serif;
      font-size: 22px;
      font-weight: 500;
      color: var(--text);
      text-decoration: none;
      letter-spacing: 0.01em;
    }

    .logo em {
      font-style: italic;
      color: var(--rose);
    }

    .nav-year {
      font-size: 12px;
      color: var(--dim);
      letter-spacing: 0.12em;
    }

    .hero {
      padding: 88px 0 64px;
      text-align: center;
    }

    .hero-eyebrow {
      font-size: 11px;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--dim);
      margin-bottom: 24px;
    }

    h1 {
      font-family: 'Playfair Display', serif;
      font-size: clamp(42px, 5.5vw, 64px);
      font-weight: 400;
      line-height: 1.12;
      letter-spacing: -0.5px;
      color: var(--text);
      margin-bottom: 20px;
    }

    h1 em {
      font-style: italic;
      color: var(--rose);
    }

    .hero-sub {
      font-size: 16px;
      color: var(--muted);
      max-width: 380px;
      margin: 0 auto 52px;
      line-height: 1.7;
      font-weight: 300;
    }

    .search-wrap {
      max-width: 440px;
      margin: 20px auto 20px;
      position: relative;
    }

    .search-icon {
      position: absolute;
      left: 18px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--dim);
      pointer-events: none;
    }

    #search {
      width: 100%;
      padding: 14px 18px 14px 46px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 100px;
      color: var(--text);
      font-family: 'Lato', sans-serif;
      font-size: 14px;
      font-weight: 300;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    #search::placeholder { color: var(--dim); }

    #search:focus {
      border-color: var(--border-hover);
      box-shadow: 0 0 0 4px rgba(201,137,122,0.08);
    }

    .divider {
      display: flex;
      align-items: center;
      gap: 16px;
      margin-bottom: 32px;
    }

    .divider-line { flex: 1; height: 1px; background: var(--border); }

    .divider-text {
      font-size: 10px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--dim);
      white-space: nowrap;
    }

    .cards-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 20px;
      margin-bottom: 72px;
    }

    .card {
      position: relative;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 32px 28px 26px;
      text-decoration: none;
      color: inherit;
      display: flex;
      flex-direction: column;
      gap: 0;
      transition: border-color 0.3s, transform 0.3s;
      overflow: hidden;
    }

    .card::after {
      content: '';
      position: absolute;
      bottom: 0; left: 0; right: 0;
      height: 3px;
      background: var(--card-accent, var(--rose));
      transform: scaleX(0);
      transform-origin: left;
      transition: transform 0.3s ease;
      border-radius: 0 0 0 0;
    }

    .card:hover::after { transform: scaleX(1); }

    .card:hover {
      border-color: var(--border-hover);
      transform: translateY(-4px);
    }

    .card-number {
      font-family: 'Playfair Display', serif;
      font-size: 11px;
      letter-spacing: 0.15em;
      color: var(--card-color, var(--rose));
      margin-bottom: 20px;
      opacity: 0.7;
    }

    .card-icon-wrap {
      width: 44px;
      height: 44px;
      border-radius: 12px;
      background: var(--card-bg, rgba(201,137,122,0.1));
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 18px;
      font-size: 20px;
    }

    .card-title {
      font-family: 'Playfair Display', serif;
      font-size: 19px;
      font-weight: 500;
      color: var(--text);
      margin-bottom: 10px;
      line-height: 1.25;
    }

    .card-desc {
      font-size: 13.5px;
      color: var(--muted);
      line-height: 1.65;
      flex: 1;
      margin-bottom: 24px;
    }

    .card-link {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      letter-spacing: 0.08em;
      color: var(--card-color, var(--rose));
      text-transform: uppercase;
    }

    .card-link svg {
      transition: transform 0.2s;
    }

    .card:hover .card-link svg {
      transform: translate(3px, -3px);
    }

    .card.hidden { display: none; }

    .no-results {
      display: none;
      text-align: center;
      padding: 60px;
      color: var(--dim);
      font-style: italic;
      font-family: 'Playfair Display', serif;
      grid-column: 1/-1;
    }
    .no-results.show { display: block; }

    .footer-strip {
      border-top: 1px solid var(--border);
      padding: 36px 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .footer-left {
      font-family: 'Playfair Display', serif;
      font-size: 14px;
      font-style: italic;
      color: var(--dim);
    }

    .footer-right {
      font-size: 12px;
      color: var(--dim);
      letter-spacing: 0.06em;
    }

    .footer-right a {
      color: var(--dim);
      text-decoration: none;
      transition: color 0.2s;
    }
    .footer-right a:hover { color: var(--muted); }

    @keyframes riseIn {
      from { opacity: 0; transform: translateY(16px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .card { animation: riseIn 0.5s ease both; }
    .card:nth-child(1) { animation-delay: 0.06s; }
    .card:nth-child(2) { animation-delay: 0.12s; }
    .card:nth-child(3) { animation-delay: 0.18s; }
    .card:nth-child(4) { animation-delay: 0.24s; }

    @media (max-width: 600px) {
      .wrap { padding: 0 20px; }
      .nav-inner { padding: 0 20px; }
      .footer-strip { flex-direction: column; gap: 12px; text-align: center; }
    }
  </style>
</head>
<body>

<nav>
  <div class="nav-inner">
    <a href="#" class="logo">machbook<em>.club</em></a>
    <span class="nav-year">©2026</span>
  </div>
</nav>

<main>
  <div class="wrap">


    <div class="search-wrap">
      <span class="search-icon">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/>
        </svg>
      </span>
      <input type="text" id="search" placeholder="搜索站点…" autocomplete="off" />
    </div>

    <div class="divider">
      <div class="divider-line"></div>
      <span class="divider-text">全部站点</span>
      <div class="divider-line"></div>
    </div>

    <div class="cards-grid" id="grid">

      <a class="card" href="https://www.machbook.club" target="_blank" rel="noopener"
         style="--card-accent: #c9897a; --card-color: #c9897a; --card-bg: rgba(201,137,122,0.1); background: #f4cccc;"
         data-name="博客 文章 写作 随笔">
        <div class="card-number">01 / 04</div>
        <div class="card-icon-wrap">✍️</div>
        <div class="card-title">个人博客</div>
        <div class="card-desc">分享那些值得被看见的文字</div>
        <div class="card-link">
          前往访问
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M7 17L17 7M7 7h10v10"/>
          </svg>
        </div>
      </a>

      <a class="card" href="https://n.machbook.club" target="_blank" rel="noopener"
         style="--card-accent: #8aab96; --card-color: #5f8a72; --card-bg: rgba(138,171,150,0.12); background: #d9ead3;"
         data-name="工具 效率 实用 助手">
        <div class="card-number">02 / 04</div>
        <div class="card-icon-wrap">🌿</div>
        <div class="card-title">News</div>
        <div class="card-desc">大西洋中文版</div>
        <div class="card-link">
          前往访问
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M7 17L17 7M7 7h10v10"/>
          </svg>
        </div>
      </a>

      <a class="card" href="https://bus.machbook.club" target="_blank" rel="noopener"
         style="--card-accent: #c4a35a; --card-color: #a07d38; --card-bg: rgba(196,163,90,0.1); background: #cfe2f3;"
         data-name="bus">
        <div class="card-number">03 / 04</div>
        <div class="card-icon-wrap">🚌</div>
        <div class="card-title">城市公交</div>
        <div class="card-desc">wuhan bus</div>
        <div class="card-link">
          前往访问
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M7 17L17 7M7 7h10v10"/>
          </svg>
        </div>
      </a>

      <a class="card" href="https://music.machbook.club" target="_blank" rel="noopener"
         style="--card-accent: #9b8db5; --card-color: #7a6898; --card-bg: rgba(155,141,181,0.1);"
         data-name="文档 说明 指南 帮助">
        <div class="card-number">04 / 04</div>
        <div class="card-icon-wrap">🎼</div>
        <div class="card-title">MUSIC</div>
        <div class="card-desc">share some AI music</div>
        <div class="card-link">
          前往访问
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M7 17L17 7M7 7h10v10"/>
          </svg>
        </div>
      </a>

      <div class="no-results" id="no-results">未找到匹配的站点…</div>
    </div>

  </div>
</main>

<footer>
  <div class="wrap">
    <div class="footer-strip">
      <span class="footer-left">聚合于此，始于idle</span>
      <span class="footer-right">
        <a href="#">关于</a>&nbsp;&nbsp;·&nbsp;&nbsp;<a href="#">反馈</a>
      </span>
    </div>
  </div>
</footer>

<script>
  const searchEl = document.getElementById('search');
  const cards = document.querySelectorAll('.card[data-name]');
  const noResults = document.getElementById('no-results');

  searchEl.addEventListener('input', () => {
    const q = searchEl.value.trim().toLowerCase();
    let visible = 0;
    cards.forEach(c => {
      const hay = (c.dataset.name + ' ' + c.querySelector('.card-title').textContent + ' ' + c.querySelector('.card-desc').textContent).toLowerCase();
      const show = !q || hay.includes(q);
      c.classList.toggle('hidden', !show);
      if (show) visible++;
    });
    noResults.classList.toggle('show', visible === 0);
  });

  document.addEventListener('keydown', e => {
    if ((e.metaKey || e.ctrlKey) && e.key === 'k') { e.preventDefault(); searchEl.focus(); }
    if (e.key === 'Escape') searchEl.blur();
  });
</script>
</body>
</html>
